<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Image</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      font-family: 'Figtree', system-ui, sans-serif;
      background: #0A0613;
      color: #FFFFFF;
      overflow: hidden;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 900px 600px at 88% 110%, rgba(236, 72, 153, 0.32) 0%, transparent 60%),
        radial-gradient(ellipse 900px 700px at -10% -20%, rgba(139, 92, 246, 0.40) 0%, transparent 60%),
        linear-gradient(180deg, #0B0716 0%, #060312 100%);
    }
    /* Subtle node/neural-network pattern */
    .nodes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .nodes svg {
      width: 100%;
      height: 100%;
    }
    /* Top row: logo + uk-registered chip */
    .top-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
    }
    .brand-name {
      font-family: 'Figtree', sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #B794F4 0%, #F472B6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .uk-chip {
      font-family: 'Source Code Pro', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #D6BCFA;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.45);
      padding: 8px 14px;
      border-radius: 6px;
    }
    /* Middle: eyebrow + headline + subtitle */
    .content {
      position: relative;
      margin-top: 78px;
      z-index: 2;
      max-width: 980px;
    }
    .eyebrow {
      display: inline-block;
      font-family: 'Source Code Pro', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #F472B6;
      margin-bottom: 28px;
    }
    .headline {
      font-family: 'Figtree', sans-serif;
      font-weight: 700;
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: #FFFFFF;
      margin-bottom: 24px;
      max-width: 1040px;
    }
    .headline.short { font-size: 72px; }
    .headline.long { font-size: 56px; }
    .headline .accent {
      background: linear-gradient(120deg, #C4B5FD 0%, #F9A8D4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-family: 'Figtree', sans-serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.45;
      color: #C5BDD9;
      max-width: 900px;
    }
    /* Bottom row: domain + CTA pill */
    .footer-row {
      position: absolute;
      bottom: 72px;
      left: 80px;
      right: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .domain {
      font-family: 'Source Code Pro', monospace;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.62);
    }
    .cta-pill {
      font-family: 'Figtree', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      background: linear-gradient(120deg, #8B5CF6 0%, #EC4899 100%);
      padding: 12px 22px;
      border-radius: 999px;
      letter-spacing: -0.01em;
      box-shadow: 0 12px 28px rgba(139, 92, 246, 0.35);
    }
    /* Soft glow accent in lower-right */
    .glow {
      position: absolute;
      width: 540px;
      height: 540px;
      bottom: -180px;
      right: -180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.22) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Decorative neural-network nodes -->
    <div class="nodes">
      <svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="strokeGrad" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
          </linearGradient>
          <radialGradient id="nodeFill">
            <stop offset="0%" stop-color="#B794F4" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
          </radialGradient>
        </defs>
        <!-- Right cluster of nodes connected -->
        <g stroke="url(#strokeGrad)" stroke-width="1.2" fill="none">
          <line x1="980" y1="120" x2="1080" y2="200" />
          <line x1="1080" y1="200" x2="1120" y2="320" />
          <line x1="1080" y1="200" x2="980" y2="300" />
          <line x1="980" y1="300" x2="1120" y2="320" />
          <line x1="980" y1="300" x2="900" y2="400" />
          <line x1="900" y1="400" x2="1120" y2="320" />
          <line x1="900" y1="400" x2="1040" y2="490" />
          <line x1="980" y1="300" x2="1040" y2="490" />
          <line x1="100" y1="80" x2="220" y2="160" />
          <line x1="220" y1="160" x2="80" y2="220" />
          <line x1="80" y1="220" x2="200" y2="320" />
        </g>
        <g fill="url(#nodeFill)">
          <circle cx="980" cy="120" r="6" />
          <circle cx="1080" cy="200" r="8" />
          <circle cx="1120" cy="320" r="5" />
          <circle cx="980" cy="300" r="7" />
          <circle cx="900" cy="400" r="6" />
          <circle cx="1040" cy="490" r="9" />
          <circle cx="100" cy="80" r="5" />
          <circle cx="220" cy="160" r="6" />
          <circle cx="80" cy="220" r="4" />
          <circle cx="200" cy="320" r="5" />
        </g>
      </svg>
    </div>

    <div class="glow"></div>

    <!-- Top: logo + UK chip -->
    <div class="top-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0%" x2="100%" y1="0%" y2="100%">
              <stop offset="0%" stop-color="#B794F4" />
              <stop offset="100%" stop-color="#F472B6" />
            </linearGradient>
          </defs>
          <circle cx="20" cy="8" r="3" fill="url(#logoGrad)" opacity="0.95"/>
          <circle cx="10" cy="20" r="3" fill="url(#logoGrad)" opacity="0.95"/>
          <circle cx="30" cy="20" r="3" fill="url(#logoGrad)" opacity="0.95"/>
          <circle cx="20" cy="32" r="3" fill="url(#logoGrad)" opacity="0.95"/>
          <circle cx="20" cy="20" r="4" fill="url(#logoGrad)"/>
          <line x1="20" y1="8" x2="20" y2="16" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
          <line x1="20" y1="24" x2="20" y2="29" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
          <line x1="17" y1="18" x2="13" y2="20" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
          <line x1="23" y1="18" x2="27" y2="20" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
          <line x1="17" y1="22" x2="13" y2="20" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
          <line x1="23" y1="22" x2="27" y2="20" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
        </svg>
        <span class="brand-name">Drag AI</span>
      </div>
      <span class="uk-chip" id="og-chip">UK Registered · AI Automation</span>
    </div>

    <!-- Center: eyebrow + headline + subtitle -->
    <div class="content">
      <div class="eyebrow" id="og-eyebrow">CATEGORY</div>
      <h1 class="headline" id="og-headline">Headline goes here</h1>
      <p class="subtitle" id="og-subtitle">Subtitle goes here.</p>
    </div>

    <!-- Bottom: domain + CTA -->
    <div class="footer-row">
      <span class="domain">drag-ai.com</span>
      <span class="cta-pill">Book Free AI Strategy Call →</span>
    </div>
  </div>
</body>
</html>
